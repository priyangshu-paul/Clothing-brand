<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | FASHION</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            FASHION
        </div>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#shop">
                Shop
            </a>

            <a href="index.html#collections">
                Collections
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </nav>

    </header>


    <!-- LOGIN -->

    <main class="auth-page">

        <div class="auth-container">

            <p class="auth-small">
                WELCOME BACK
            </p>

            <h1>
                Login
            </h1>

            <p class="auth-description">
                Login to your FASHION account.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    LOGIN
                </button>

            </form>


            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </main>


       <!-- Your other HTML content -->


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/auth.js"></script>

</body>
</html>
