<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | FASHION</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body>


    <!-- =========================
         ADMIN LOGIN
    ========================== -->

    <main class="auth-page">

        <div class="auth-container">

            <p class="auth-small">
                FASHION ADMIN
            </p>

            <h1>
                Admin Login
            </h1>

            <p class="auth-description">
                Sign in to manage your store.
            </p>


            <form id="adminLoginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="adminEmail">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    ADMIN LOGIN
                </button>


            </form>


            <p class="auth-switch">

                <a href="index.html">
                    ← Back to Store
                </a>

            </p>

        </div>

    </main>


    <script src="js/admin-login.js"></script>

</body>

</html>
