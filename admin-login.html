<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | FASHION</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <p class="auth-small">
                FASHION ADMIN
            </p>

            <h1>
                Admin Login
            </h1>

            <p class="auth-description">
                Sign in to manage your store.
            </p>

            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="adminEmail">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="auth-btn"
                    id="adminLoginButton"
                >
                    ADMIN LOGIN
                </button>

            </form>

            <p class="auth-switch">

                <a href="index.html">
                    ← Back to Store
                </a>

            </p>

        </div>

    </main>


    <!-- SUPABASE LIBRARY -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
    ></script>


    <!-- YOUR SUPABASE CONFIG -->

    <script src="supabase.js"></script>


    <!-- ADMIN LOGIN -->

    <script src="admin-login.js"></script>

</body>

</html>
