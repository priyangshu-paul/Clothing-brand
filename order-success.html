<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Confirmed | FASHION</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="success.css"
    >

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="logo">
            FASHION
        </div>


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#shop">
                Shop
            </a>

            <a href="index.html#collections">
                Collections
            </a>

            <a href="index.html#about">
                About
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </nav>

    </header>



    <!-- =========================
         SUCCESS PAGE
    ========================== -->

    <main class="success-page">


        <div class="success-container">


            <!-- SUCCESS ICON -->

            <div class="success-icon">
                ✓
            </div>


            <!-- TITLE -->

            <p class="success-small">
                THANK YOU
            </p>


            <h1>
                Order Confirmed
            </h1>


            <p class="success-message">

                Your order has been successfully placed.
                We will start preparing your order shortly.

            </p>



            <!-- ORDER ID -->

            <div class="order-id-box">

                <span>
                    ORDER ID
                </span>

                <strong id="orderNumber">
                    FASH00000000
                </strong>

            </div>



            <!-- ORDER DETAILS -->

            <section class="success-section">

                <h2>
                    Order Details
                </h2>


                <div id="successProducts">
                    <!-- Products will appear here -->
                </div>


                <div class="success-line">

                    <span>
                        Payment
                    </span>

                    <strong id="successPayment">
                        Cash on Delivery
                    </strong>

                </div>


                <div class="success-total">

                    <span>
                        Total
                    </span>

                    <strong id="successTotal">
                        ₹0
                    </strong>

                </div>

            </section>



            <!-- CUSTOMER -->

            <section class="success-section">

                <h2>
                    Delivery Information
                </h2>


                <div id="customerInfo">

                    <!-- Customer information -->

                </div>

            </section>



            <!-- BUTTONS -->

            <div class="success-buttons">

                <a
                    href="index.html#shop"
                    class="success-btn primary"
                >
                    CONTINUE SHOPPING
                </a>


                <a
                    href="index.html"
                    class="success-btn secondary"
                >
                    BACK TO HOME
                </a>

            </div>


        </div>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="success.js"></script>


</body>

</html>
