<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard | FASHION</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f6f6f6;
            color: #111;
            font-family: Arial, sans-serif;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        .admin-navbar {
            min-height: 72px;
            padding: 0 6%;
            background: #111;
            color: #fff;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .admin-logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .admin-nav-actions {
            display: flex;
            gap: 10px;
        }

        .admin-nav-btn {
            border: 1px solid rgba(255,255,255,.35);
            background: transparent;
            color: #fff;

            padding: 10px 16px;

            border-radius: 7px;

            text-decoration: none;

            font-size: 12px;
            font-weight: 700;

            cursor: pointer;
        }

        .admin-nav-btn:hover {
            background: #fff;
            color: #111;
        }

        .logout-btn {
            background: #d32f2f;
            border-color: #d32f2f;
        }

        .admin-page {
            width: 100%;
            max-width: 1400px;
            margin: auto;

            padding: 45px 6%;
        }

        .admin-header {
            margin-bottom: 30px;
        }

        .admin-header h1 {
            margin: 0 0 8px;
            font-size: 34px;
        }

        .admin-header p {
            margin: 0;
            color: #777;
        }

        .admin-user {
            display: inline-block;

            margin-top: 15px;

            padding: 9px 14px;

            background: #fff;

            border-radius: 7px;

            color: #555;

            font-size: 13px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.05);
        }

        .dashboard-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 25px;
        }

        .dashboard-card {
            background: #fff;

            border-radius: 12px;

            padding: 24px;

            box-shadow:
                0 7px 25px rgba(0,0,0,.05);
        }

        .dashboard-card span {
            color: #777;
            font-size: 13px;
        }

        .dashboard-card strong {
            display: block;

            margin-top: 8px;

            font-size: 30px;
        }

        .admin-section {
            background: #fff;

            border-radius: 12px;

            padding: 28px;

            margin-bottom: 25px;

            box-shadow:
                0 7px 25px rgba(0,0,0,.05);
        }

        .section-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 20px;
        }

        .section-header h2 {
            margin: 0;
        }

        .primary-btn {
            border: none;

            background: #111;
            color: #fff;

            padding: 11px 16px;

            border-radius: 7px;

            font-weight: 700;
            font-size: 12px;

            cursor: pointer;
        }

        .primary-btn:hover {
            opacity: .85;
        }

        .secondary-btn {
            border: none;

            background: #eee;
            color: #111;

            padding: 11px 16px;

            border-radius: 7px;

            font-weight: 700;
            font-size: 12px;

            cursor: pointer;
        }

        .danger-btn {
            border: none;

            background: #d32f2f;
            color: #fff;

            padding: 10px 14px;

            border-radius: 6px;

            font-weight: 700;
            font-size: 11px;

            cursor: pointer;
        }

        .search-row {
            display: flex;

            gap: 10px;

            margin-bottom: 20px;
        }

        .search-row input,
        .search-row select {
            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 7px;

            outline: none;
        }

        .search-row input {
            flex: 1;
        }

        .products-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;
        }

        .product-card {
            border: 1px solid #eee;

            border-radius: 10px;

            overflow: hidden;

            background: #fff;
        }

        .product-image {
            width: 100%;
            height: 230px;

            background: #f1f1f1;
        }

        .product-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .product-info {
            padding: 17px;
        }

        .product-info h3 {
            margin: 5px 0 8px;
            font-size: 17px;
        }

        .product-info p {
            margin: 5px 0;
            color: #777;
            font-size: 13px;
        }

        .product-actions {
            display: flex;

            gap: 8px;

            padding: 0 17px 17px;
        }

        .product-actions button {
            flex: 1;
        }

        .orders-list {
            display: grid;
            gap: 18px;
        }

        .order-card {
            border: 1px solid #eee;

            border-radius: 10px;

            padding: 20px;
        }

        .order-top {
            display: flex;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 18px;
        }

        .order-top h3 {
            margin: 0 0 5px;
        }

        .order-top p {
            margin: 0;

            color: #777;

            font-size: 13px;
        }

        .status-box label {
            display: block;

            margin-bottom: 5px;

            font-size: 10px;

            font-weight: 700;

            color: #777;
        }

        .status-box select {
            padding: 9px;

            border: 1px solid #ddd;

            border-radius: 6px;
        }

        .customer-box {
            background: #fafafa;

            padding: 15px;

            border-radius: 8px;

            margin-bottom: 15px;
        }

        .customer-box h4 {
            margin: 0 0 10px;
        }

        .customer-box p {
            margin: 5px 0;

            font-size: 13px;

            color: #555;
        }

        .order-items {
            display: grid;

            gap: 10px;
        }

        .order-item {
            display: flex;

            align-items: center;

            gap: 12px;

            padding: 10px;

            border: 1px solid #eee;

            border-radius: 7px;
        }

        .order-item img {
            width: 60px;
            height: 60px;

            object-fit: cover;

            border-radius: 6px;

            background: #eee;
        }

        .order-item strong {
            display: block;

            margin-bottom: 4px;
        }

        .order-item span {
            color: #777;

            font-size: 12px;
        }

        .order-footer {
            display: flex;

            justify-content: space-between;

            gap: 20px;

            margin-top: 18px;

            padding-top: 15px;

            border-top: 1px solid #eee;
        }

        .order-footer span {
            display: block;

            color: #777;

            font-size: 10px;

            margin-bottom: 4px;
        }

        .customers-table {
            width: 100%;

            border-collapse: collapse;
        }

        .customers-table th,
        .customers-table td {
            padding: 13px;

            text-align: left;

            border-bottom: 1px solid #eee;

            font-size: 13px;
        }

        .customers-table th {
            font-size: 11px;
            text-transform: uppercase;
            color: #777;
        }

        .empty {
            padding: 40px;

            text-align: center;

            color: #777;

            border: 1px dashed #ddd;

            border-radius: 8px;
        }

        .modal {
            position: fixed;

            inset: 0;

            z-index: 9999;

            background: rgba(0,0,0,.65);

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 650px;

            max-height: 90vh;

            overflow-y: auto;

            background: #fff;

            border-radius: 12px;

            padding: 25px;
        }

        .modal-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-btn {
            width: 35px;
            height: 35px;

            border: none;

            border-radius: 50%;

            background: #eee;

            cursor: pointer;

            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;

            margin-bottom: 6px;

            font-size: 12px;

            font-weight: 700;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;

            padding: 11px;

            border: 1px solid #ddd;

            border-radius: 7px;

            outline: none;
        }

        .form-group textarea {
            min-height: 100px;

            resize: vertical;
        }

        .form-row {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;
        }

        .checkbox-row {
            display: flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 15px;

            font-size: 13px;
        }

        .modal-actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 20px;
        }

        .loading {
            padding: 30px;

            text-align: center;

            color: #777;
        }

        .toast {
            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 20000;

            background: #111;
            color: #fff;

            padding: 13px 18px;

            border-radius: 7px;

            display: none;

            font-size: 13px;
        }

        .toast.show {
            display: block;
        }

        @media (max-width: 1000px) {

            .dashboard-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .products-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 650px) {

            .admin-navbar {
                padding: 15px 5%;

                flex-direction: column;

                align-items: flex-start;
            }

            .admin-nav-actions {
                width: 100%;
            }

            .admin-nav-btn {
                flex: 1;
                text-align: center;
            }

            .admin-page {
                padding: 30px 5%;
            }

            .dashboard-grid,
            .products-grid {
                grid-template-columns: 1fr;
            }

            .search-row,
            .order-top,
            .order-footer {
                flex-direction: column;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .customers-table {
                display: block;
                overflow-x: auto;
            }

        }

    </style>

</head>


<body>

<header class="admin-navbar">

    <div class="admin-logo">
        FASHION
    </div>

    <div class="admin-nav-actions">

        <a
            href="index.html"
            class="admin-nav-btn"
        >
            ← STORE
        </a>

        <button
            type="button"
            id="adminLogout"
            class="admin-nav-btn logout-btn"
        >
            LOGOUT
        </button>

    </div>

</header>


<main class="admin-page">


    <!-- =================================================
         HEADER
    ================================================== -->

    <section class="admin-header">

        <h1>
            Admin Dashboard
        </h1>

        <p>
            Manage your FASHION store.
        </p>

        <div
            class="admin-user"
            id="adminUserInfo"
        >
            Checking admin session...
        </div>

    </section>


    <!-- =================================================
         DASHBOARD
    ================================================== -->

    <section class="dashboard-grid">

        <div class="dashboard-card">

            <span>
                TOTAL PRODUCTS
            </span>

            <strong id="productCount">
                0
            </strong>

        </div>


        <div class="dashboard-card">

            <span>
                TOTAL ORDERS
            </span>

            <strong id="orderCount">
                0
            </strong>

        </div>


        <div class="dashboard-card">

            <span>
                CUSTOMERS
            </span>

            <strong id="customerCount">
                0
            </strong>

        </div>


        <div class="dashboard-card">

            <span>
                TOTAL SALES
            </span>

            <strong id="salesCount">
                ₹0
            </strong>

        </div>

    </section>


    <!-- =================================================
         PRODUCTS
    ================================================== -->

    <section class="admin-section">

        <div class="section-header">

            <h2>
                Products
            </h2>

            <button
                type="button"
                id="addProductBtn"
                class="primary-btn"
            >
                + ADD PRODUCT
            </button>

        </div>

        <div class="search-row">

            <input
                type="search"
                id="productSearch"
                placeholder="Search products..."
            >

            <select id="productCategoryFilter">

                <option value="all">
                    All Categories
                </option>

                <option value="men">
                    Men
                </option>

                <option value="women">
                    Women
                </option>

                <option value="accessories">
                    Accessories
                </option>

                <option value="new">
                    New
                </option>

            </select>

        </div>

        <div
            id="adminProductList"
            class="products-grid"
        >

            <div class="loading">
                Loading products...
            </div>

        </div>

    </section>


    <!-- =================================================
         ORDERS
    ================================================== -->

    <section class="admin-section">

        <div class="section-header">

            <h2>
                Orders
            </h2>

        </div>

        <div class="search-row">

            <input
                type="search"
                id="orderSearch"
                placeholder="Search order, customer, email..."
            >

            <select id="orderStatusFilter">

                <option value="all">
                    All Status
                </option>

                <option value="Confirmed">
                    Confirmed
                </option>

                <option value="Processing">
                    Processing
                </option>

                <option value="Shipped">
                    Shipped
                </option>

                <option value="Delivered">
                    Delivered
                </option>

                <option value="Cancelled">
                    Cancelled
                </option>

            </select>

        </div>

        <div
            id="adminOrders"
            class="orders-list"
        >

            <div class="loading">
                Loading orders...
            </div>

        </div>

    </section>


    <!-- =================================================
         CUSTOMERS
    ================================================== -->

    <section class="admin-section">

        <div class="section-header">

            <h2>
                Customers
            </h2>

        </div>

        <div
            id="customersContainer"
        >

            <div class="loading">
                Loading customers...
            </div>

        </div>

    </section>


</main>


<!-- =====================================================
     PRODUCT MODAL
====================================================== -->

<div
    id="productModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="productModalTitle">
                Add Product
            </h2>

            <button
                type="button"
                id="closeProductModal"
                class="close-btn"
            >
                ×
            </button>

        </div>


        <form id="productForm">

            <input
                type="hidden"
                id="productId"
            >


            <div class="form-group">

                <label for="productName">
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="productPrice">
                        Price
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="productStock">
                        Stock
                    </label>

                    <input
                        type="number"
                        id="productStock"
                        min="0"
                        step="1"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="productCategory">
                        Category
                    </label>

                    <input
                        type="text"
                        id="productCategory"
                        placeholder="e.g. men"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="productGender">
                        Gender
                    </label>

                    <select id="productGender">

                        <option value="">
                            Select
                        </option>

                        <option value="men">
                            Men
                        </option>

                        <option value="women">
                            Women
                        </option>

                        <option value="unisex">
                            Unisex
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="productSizes">
                    Sizes
                </label>

                <input
                    type="text"
                    id="productSizes"
                    placeholder="S, M, L, XL"
                >

            </div>


            <div class="form-group">

                <label for="productImage">
                    Product Image URL
                </label>

                <input
                    type="url"
                    id="productImage"
                    placeholder="https://..."
                >

            </div>


            <div class="form-group">

                <label for="productDescription">
                    Description
                </label>

                <textarea
                    id="productDescription"
                ></textarea>

            </div>


            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="productIsNew"
                >

                Mark as New Product

            </label>


            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelProductBtn"
                    class="secondary-btn"
                >
                    CANCEL
                </button>

                <button
                    type="submit"
                    class="primary-btn"
                    id="saveProductBtn"
                >
                    SAVE PRODUCT
                </button>

            </div>

        </form>

    </div>

</div>


<div
    id="toast"
    class="toast"
></div>


<!-- =====================================================
     SUPABASE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<!-- =====================================================
     ADMIN SYSTEM
====================================================== -->

<script src="admin.js"></script>


</body>

</html>
